name = tasks
owner = rhun-editor
title = Tasks
description = Finds your project's tasks (make targets, npm scripts, Cargo and Go builds, your own) for Run Task, with their errors as problems.
icon = icon.png
color = #9a6ad6
version = 0.2.0
protocol = 1
run.linux-x86_64 = bin/tasks-linux-x86_64
run.macos-arm64 = bin/tasks-macos-arm64
run.windows-x64 = bin/tasks-windows-x64.exe
on = project

[commands]
run = Run Task... | ctrl+alt+r
rescan = Rescan Tasks
stop = Stop Task...
restart = Restart Task...
show = Show Task...

[needs]
project = read
terminal = run
